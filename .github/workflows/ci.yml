name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (hash-pinned when the lock exists)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f packaging/requirements-build.lock ]; then
            python -m pip install --require-hashes -r packaging/requirements-build.lock
          else
            echo "::warning::packaging/requirements-build.lock missing; installing version pins without hash verification"
            python -m pip install -r packaging/requirements-build.in
          fi
          python -m pip install --no-deps -e .
      - name: Dependency audit
        run: python -m pip_audit --strict --desc -r packaging/requirements-build.in
      - name: Tests
        run: python -m pytest -q
      - name: Frozen self-test smoke (window, viewer, demo flow)
        if: runner.os == 'Windows'
        run: python -m scrubdicom.app --selftest

  hygiene:
    name: repo hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pydicom numpy pytest pyflakes
      - run: python -m pyflakes scrubdicom/app scrubdicom/profiles.py scrubdicom/ocr.py
      - run: python -m pytest -q tests/test_repo_hygiene.py tests/test_profiles.py tests/test_app_model.py
